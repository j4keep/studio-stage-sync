<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1C2C"/>
      <stop offset="0.45" stop-color="#12324A"/>
      <stop offset="0.72" stop-color="#1A4B63"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="820" x2="0" y2="1350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 520) rotate(90) scale(180 140)">
      <stop stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1350" fill="url(#sky)"/>
  <rect y="820" width="900" height="530" fill="url(#water)"/>
  <!-- pier -->
  <path d="M40 900 L860 860 L860 920 L40 980 Z" fill="#1E293B"/>
  <rect x="120" y="900" width="18" height="160" fill="#334155"/>
  <rect x="280" y="885" width="18" height="175" fill="#334155"/>
  <rect x="460" y="875" width="18" height="185" fill="#334155"/>
  <rect x="640" y="865" width="18" height="195" fill="#334155"/>
  <rect x="780" y="855" width="18" height="205" fill="#334155"/>
  <!-- lighthouse -->
  <rect x="690" y="420" width="56" height="320" fill="#E2E8F0"/>
  <rect x="678" y="400" width="80" height="30" fill="#94A3B8"/>
  <circle cx="718" cy="390" r="22" fill="#FBBF24"/>
  <circle cx="718" cy="390" r="90" fill="url(#glow)"/>
  <!-- ferry silhouette -->
  <path d="M120 780 L320 760 L380 780 L360 820 L140 830 Z" fill="#0F172A"/>
  <rect x="200" y="730" width="70" height="40" fill="#1E293B"/>
  <!-- title block -->
  <rect x="70" y="980" width="760" height="260" rx="8" fill="#020617" fill-opacity="0.55"/>
  <text x="450" y="1070" text-anchor="middle" fill="#F8FAFC" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700">Harbor Lights</text>
  <text x="450" y="1135" text-anchor="middle" fill="#7DD3FC" font-family="Helvetica, Arial, sans-serif" font-size="28" letter-spacing="4">A NOVELLA</text>
  <text x="450" y="1195" text-anchor="middle" fill="#CBD5E1" font-family="Georgia, serif" font-size="32">Amara Quinn</text>
</svg>
