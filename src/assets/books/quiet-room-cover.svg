<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="window" x1="260" y1="280" x2="640" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <radialGradient id="soft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(450 520) rotate(90) scale(260 200)">
      <stop stop-color="#F8FAFC" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1350" fill="url(#bg)"/>
  <circle cx="450" cy="480" r="1" fill="url(#soft)"/>
  <!-- quiet room frame -->
  <rect x="180" y="220" width="540" height="560" rx="8" fill="#020617" stroke="#64748B" stroke-width="8"/>
  <rect x="220" y="260" width="460" height="400" fill="url(#window)"/>
  <!-- rain streaks on glass -->
  <path d="M260 300 L270 620" stroke="#64748B" stroke-opacity="0.35" stroke-width="3"/>
  <path d="M320 280 L335 640" stroke="#64748B" stroke-opacity="0.28" stroke-width="3"/>
  <path d="M400 290 L410 630" stroke="#64748B" stroke-opacity="0.32" stroke-width="3"/>
  <path d="M480 300 L495 640" stroke="#64748B" stroke-opacity="0.25" stroke-width="3"/>
  <path d="M560 285 L575 625" stroke="#64748B" stroke-opacity="0.3" stroke-width="3"/>
  <path d="M620 310 L630 610" stroke="#64748B" stroke-opacity="0.22" stroke-width="3"/>
  <!-- three chairs silhouette -->
  <rect x="280" y="700" width="70" height="12" rx="2" fill="#0F172A"/>
  <rect x="300" y="640" width="30" height="60" fill="#0F172A"/>
  <rect x="415" y="700" width="70" height="12" rx="2" fill="#0F172A"/>
  <rect x="435" y="640" width="30" height="60" fill="#0F172A"/>
  <rect x="550" y="700" width="70" height="12" rx="2" fill="#0F172A"/>
  <rect x="570" y="640" width="30" height="60" fill="#0F172A"/>
  <!-- table -->
  <ellipse cx="450" cy="720" rx="110" ry="18" fill="#1E293B"/>
  <!-- title -->
  <rect x="90" y="980" width="720" height="250" rx="10" fill="#020617" fill-opacity="0.55"/>
  <text x="450" y="1070" text-anchor="middle" fill="#F1F5F9" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700">The Quiet Room</text>
  <text x="450" y="1135" text-anchor="middle" fill="#94A3B8" font-family="Helvetica, Arial, sans-serif" font-size="24" letter-spacing="4">A MEDIATION NOVELLA</text>
  <text x="450" y="1195" text-anchor="middle" fill="#CBD5E1" font-family="Georgia, serif" font-size="32">S. Vale</text>
</svg>
