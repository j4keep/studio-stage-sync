<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <defs>
    <radialGradient id="fb-bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1c3a24"/>
      <stop offset="55%" stop-color="#0f2416"/>
      <stop offset="100%" stop-color="#08130c"/>
    </radialGradient>
    <linearGradient id="fb-ball" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a5a34"/>
      <stop offset="100%" stop-color="#5c3a1f"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="768" fill="url(#fb-bg)"/>

  <!-- Yard lines -->
  <g stroke="rgba(255,255,255,0.16)" stroke-width="4">
    <line x1="120" y1="0" x2="120" y2="768"/>
    <line x1="320" y1="0" x2="320" y2="768"/>
    <line x1="520" y1="0" x2="520" y2="768"/>
    <line x1="720" y1="0" x2="720" y2="768"/>
    <line x1="920" y1="0" x2="920" y2="768"/>
  </g>
  <ellipse cx="512" cy="380" rx="420" ry="280" fill="#22c55e" opacity="0.06"/>

  <!-- Goal post -->
  <g stroke="#e9e4d8" stroke-width="10" fill="none" opacity="0.55">
    <line x1="512" y1="90" x2="512" y2="260"/>
    <line x1="412" y1="90" x2="612" y2="90"/>
    <line x1="412" y1="90" x2="412" y2="150"/>
    <line x1="612" y1="90" x2="612" y2="150"/>
  </g>

  <!-- Football -->
  <g transform="translate(512,470) rotate(-18)">
    <ellipse cx="0" cy="0" rx="180" ry="105" fill="url(#fb-ball)" stroke="#2a1710" stroke-width="6"/>
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#e8dcc8" stroke-width="6"/>
    <line x1="-18" y1="-22" x2="-18" y2="22" stroke="#e8dcc8" stroke-width="5"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#e8dcc8" stroke-width="5"/>
    <line x1="18" y1="-22" x2="18" y2="22" stroke="#e8dcc8" stroke-width="5"/>
  </g>

  <!-- Impact burst -->
  <g transform="translate(700,430)" opacity="0.85">
    <path d="M0,-56 L13,-13 L56,0 L13,13 L0,56 L-13,13 L-56,0 L-13,-13 Z" fill="#ffffff"/>
  </g>

  <!-- Field turf accent -->
  <rect x="0" y="620" width="1024" height="148" fill="#0a1a10"/>
  <line x1="0" y1="620" x2="1024" y2="620" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
</svg>
