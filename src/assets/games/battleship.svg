<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <defs>
    <radialGradient id="bs-bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#123a52"/>
      <stop offset="55%" stop-color="#0a2438"/>
      <stop offset="100%" stop-color="#04121e"/>
    </radialGradient>
    <linearGradient id="bs-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fa3b3"/>
      <stop offset="100%" stop-color="#4c5f6e"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="768" fill="url(#bs-bg)"/>

  <!-- Targeting grid -->
  <g stroke="rgba(255,255,255,0.14)" stroke-width="3">
    <line x1="120" y1="120" x2="120" y2="620"/>
    <line x1="280" y1="120" x2="280" y2="620"/>
    <line x1="440" y1="120" x2="440" y2="620"/>
    <line x1="600" y1="120" x2="600" y2="620"/>
    <line x1="760" y1="120" x2="760" y2="620"/>
    <line x1="920" y1="120" x2="920" y2="620"/>
    <line x1="120" y1="120" x2="920" y2="120"/>
    <line x1="120" y1="280" x2="920" y2="280"/>
    <line x1="120" y1="440" x2="920" y2="440"/>
    <line x1="120" y1="600" x2="920" y2="600"/>
  </g>

  <!-- Hit/miss markers -->
  <circle cx="360" cy="200" r="10" fill="#ffffff" opacity="0.75"/>
  <circle cx="520" cy="360" r="10" fill="#ffffff" opacity="0.75"/>
  <g transform="translate(680,200)" stroke="#e0453f" stroke-width="8" stroke-linecap="round">
    <line x1="-14" y1="-14" x2="14" y2="14"/>
    <line x1="14" y1="-14" x2="-14" y2="14"/>
  </g>
  <g transform="translate(200,440)" stroke="#e0453f" stroke-width="8" stroke-linecap="round">
    <line x1="-14" y1="-14" x2="14" y2="14"/>
    <line x1="14" y1="-14" x2="-14" y2="14"/>
  </g>

  <!-- Ship silhouette -->
  <g transform="translate(560,470)">
    <path d="M -220 40 L -180 90 L 200 90 L 240 40 Z" fill="url(#bs-hull)" stroke="#1c2933" stroke-width="4"/>
    <rect x="-90" y="-30" width="140" height="70" rx="6" fill="#33465a" stroke="#1c2933" stroke-width="4"/>
    <rect x="-40" y="-70" width="60" height="44" rx="4" fill="#405568" stroke="#1c2933" stroke-width="3"/>
    <line x1="-10" y1="-70" x2="-10" y2="-120" stroke="#1c2933" stroke-width="6"/>
  </g>

  <!-- Ring canvas floor accent -->
  <rect x="0" y="620" width="1024" height="148" fill="#03101a"/>
  <line x1="0" y1="620" x2="1024" y2="620" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
</svg>
