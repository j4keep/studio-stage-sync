<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <defs>
    <radialGradient id="bx-bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#16233a"/>
      <stop offset="55%" stop-color="#0d1729"/>
      <stop offset="100%" stop-color="#050a16"/>
    </radialGradient>
    <linearGradient id="bx-glove-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fc9ff"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="bx-glove-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcf7a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="768" fill="url(#bx-bg)"/>

  <!-- Ropes -->
  <g opacity="0.7">
    <line x1="40" y1="230" x2="984" y2="230" stroke="#e9e4d8" stroke-width="6"/>
    <line x1="40" y1="290" x2="984" y2="290" stroke="#0ea5e9" stroke-width="6"/>
    <line x1="40" y1="350" x2="984" y2="350" stroke="#e9e4d8" stroke-width="6"/>
  </g>
  <rect x="30" y="150" width="26" height="220" rx="8" fill="#2a1810"/>
  <rect x="968" y="150" width="26" height="220" rx="8" fill="#2a1810"/>

  <!-- Spotlight -->
  <ellipse cx="512" cy="420" rx="420" ry="300" fill="#0ea5e9" opacity="0.08"/>

  <!-- Left glove, cocked back -->
  <g transform="translate(260,470) rotate(-18)">
    <ellipse cx="0" cy="0" rx="120" ry="95" fill="url(#bx-glove-blue)"/>
    <ellipse cx="-60" cy="-10" rx="46" ry="60" fill="url(#bx-glove-blue)"/>
    <path d="M -20 -70 Q 0 -100 30 -70 L 20 -20 L -10 -20 Z" fill="url(#bx-glove-blue)"/>
  </g>

  <!-- Right glove, punching forward -->
  <g transform="translate(760,430) rotate(12)">
    <ellipse cx="0" cy="0" rx="130" ry="102" fill="url(#bx-glove-amber)"/>
    <ellipse cx="70" cy="-8" rx="50" ry="64" fill="url(#bx-glove-amber)"/>
  </g>

  <!-- Impact burst -->
  <g transform="translate(560,420)" opacity="0.9">
    <path d="M0,-60 L14,-14 L60,0 L14,14 L0,60 L-14,14 L-60,0 L-14,-14 Z" fill="#ffffff"/>
  </g>

  <!-- Ring canvas floor accent -->
  <rect x="0" y="620" width="1024" height="148" fill="#0a1220"/>
  <line x1="0" y1="620" x2="1024" y2="620" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
</svg>
