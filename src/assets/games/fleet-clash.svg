<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <defs>
    <linearGradient id="fc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd6e6"/>
      <stop offset="45%" stop-color="#3fa8c4"/>
      <stop offset="100%" stop-color="#1c6f92"/>
    </linearGradient>
    <linearGradient id="fc-hull-teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fd1de"/>
      <stop offset="100%" stop-color="#1c7d87"/>
    </linearGradient>
    <linearGradient id="fc-hull-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8f5fc9"/>
      <stop offset="100%" stop-color="#472a6b"/>
    </linearGradient>
    <linearGradient id="fc-hull-coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9a7d"/>
      <stop offset="100%" stop-color="#c9573a"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="768" fill="url(#fc-sky)"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="180" cy="110" rx="70" ry="24"/>
    <ellipse cx="230" cy="95" rx="50" ry="20"/>
    <ellipse cx="820" cy="90" rx="80" ry="26"/>
    <ellipse cx="870" cy="75" rx="46" ry="18"/>
  </g>

  <!-- distant island -->
  <g transform="translate(860,330)" opacity="0.9">
    <ellipse cx="0" cy="0" rx="110" ry="34" fill="#e8d4a0"/>
    <ellipse cx="-10" cy="-8" rx="80" ry="30" fill="#6fbf6f"/>
  </g>

  <!-- water -->
  <rect x="0" y="380" width="1024" height="388" fill="#2696b8"/>
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="4" fill="none">
    <path d="M0,430 Q60,415 120,430 T240,430 T360,430 T480,430 T600,430 T720,430 T840,430 T960,430 T1080,430"/>
    <path d="M0,500 Q70,482 140,500 T280,500 T420,500 T560,500 T700,500 T840,500 T980,500"/>
    <path d="M0,600 Q80,580 160,600 T320,600 T480,600 T640,600 T800,600 T960,600"/>
  </g>

  <!-- foreground island, left -->
  <g transform="translate(150,560)">
    <ellipse cx="0" cy="30" rx="160" ry="44" fill="#e8d4a0"/>
    <ellipse cx="-20" cy="10" rx="120" ry="50" fill="#6fbf6f"/>
    <g transform="translate(-60,-30)">
      <path d="M0,0 Q14,-70 40,-110" stroke="#8a5a2b" stroke-width="9" fill="none" stroke-linecap="round"/>
      <g stroke="#3fae5c" stroke-width="12" stroke-linecap="round">
        <path d="M40,-110 Q75,-130 100,-115"/>
        <path d="M40,-110 Q70,-150 90,-160"/>
        <path d="M40,-110 Q20,-150 5,-165"/>
        <path d="M40,-110 Q0,-120 -25,-105"/>
      </g>
    </g>
  </g>

  <!-- small buoy -->
  <g transform="translate(430,470)">
    <ellipse cx="0" cy="14" rx="16" ry="5" fill="#000000" opacity="0.15"/>
    <circle cx="0" cy="0" r="14" fill="#ff7a59"/>
    <rect x="-14" y="-4" width="28" height="8" fill="#ffffff"/>
  </g>

  <!-- Skimmer boat (coral), midground -->
  <g transform="translate(300,640) rotate(-4)">
    <ellipse cx="0" cy="46" rx="130" ry="20" fill="#000000" opacity="0.18"/>
    <path d="M -120 0 L -100 40 L 120 40 L 140 0 Q 140 -14 120 -14 L -100 -14 Q -120 -14 -120 0 Z" fill="url(#fc-hull-coral)" stroke="#7a3220" stroke-width="5"/>
    <rect x="-40" y="-46" width="70" height="34" rx="6" fill="#c9573a" stroke="#7a3220" stroke-width="4"/>
    <!-- crew -->
    <g transform="translate(-4,-70)">
      <rect x="-9" y="0" width="18" height="20" fill="#6B3FA0"/>
      <rect x="-8" y="-16" width="16" height="16" fill="#f2c396"/>
    </g>
  </g>

  <!-- Voyager boat (teal), foreground, largest -->
  <g transform="translate(660,690) rotate(3)">
    <ellipse cx="0" cy="58" rx="190" ry="26" fill="#000000" opacity="0.2"/>
    <path d="M -180 0 L -150 56 L 180 56 L 210 0 Q 210 -18 180 -18 L -150 -18 Q -180 -18 -180 0 Z" fill="url(#fc-hull-teal)" stroke="#0f4a52" stroke-width="6"/>
    <rect x="-60" y="-64" width="110" height="48" rx="8" fill="#1c7d87" stroke="#0f4a52" stroke-width="5"/>
    <rect x="-20" y="-96" width="30" height="34" rx="4" fill="#2FB6C4" stroke="#0f4a52" stroke-width="4"/>
    <!-- crew, celebrating -->
    <g transform="translate(-2,-118)">
      <rect x="-10" y="4" width="8" height="18" fill="#f2c396" transform="rotate(-25)"/>
      <rect x="4" y="4" width="8" height="18" fill="#f2c396" transform="rotate(25)"/>
      <rect x="-10" y="0" width="20" height="22" fill="#6B3FA0"/>
      <rect x="-9" y="-17" width="18" height="17" fill="#f2c396"/>
    </g>
  </g>

  <!-- projectile splash accent -->
  <g transform="translate(560,540)" opacity="0.9">
    <circle cx="0" cy="0" r="7" fill="#ffffff"/>
    <g stroke="#ffffff" stroke-width="3" fill="none" opacity="0.8">
      <circle cx="0" cy="0" r="22"/>
      <circle cx="0" cy="0" r="34"/>
    </g>
  </g>

  <!-- YAJ purple/teal accent bar -->
  <rect x="0" y="0" width="1024" height="10" fill="#6B3FA0"/>
  <rect x="0" y="758" width="1024" height="10" fill="#2FB6C4"/>
</svg>
