<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ED0DC" />
      <stop offset="100%" stop-color="#CFF8EF" />
    </linearGradient>
    <linearGradient id="bldgA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9A6BDD" />
      <stop offset="100%" stop-color="#5A3494" />
    </linearGradient>
    <linearGradient id="bldgB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A4FC9" />
      <stop offset="100%" stop-color="#432A72" />
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A3570" />
      <stop offset="100%" stop-color="#1D1230" />
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#52E1E8" />
      <stop offset="100%" stop-color="#1B8B96" />
    </linearGradient>
    <linearGradient id="head" x1="0.2" y1="0.15" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FCD9B0" />
      <stop offset="100%" stop-color="#D89A6B" />
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9A6BDD" />
      <stop offset="100%" stop-color="#5A3494" />
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A3570" />
      <stop offset="100%" stop-color="#1B1230" />
    </linearGradient>
    <linearGradient id="shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9C7D" />
      <stop offset="100%" stop-color="#E85A3D" />
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#sky)" />
  <circle cx="320" cy="60" r="24" fill="#FFD166" />

  <rect x="0" y="120" width="66" height="140" fill="url(#bldgA)" />
  <rect x="60" y="80" width="80" height="180" fill="url(#bldgB)" />
  <rect x="270" y="100" width="70" height="160" fill="url(#bldgB)" />
  <rect x="334" y="140" width="66" height="120" fill="url(#bldgA)" />
  <g fill="#2A1B45" opacity="0.5">
    <rect x="12" y="140" width="10" height="12"/><rect x="30" y="140" width="10" height="12"/>
    <rect x="80" y="100" width="10" height="12"/><rect x="100" y="100" width="10" height="12"/>
    <rect x="80" y="130" width="10" height="12"/><rect x="100" y="130" width="10" height="12"/>
    <rect x="286" y="120" width="10" height="12"/><rect x="308" y="120" width="10" height="12"/>
  </g>

  <rect x="0" y="260" width="400" height="30" fill="#E6DCC9" />
  <polygon points="150,290 250,290 340,400 60,400" fill="url(#road)" />
  <line x1="180" y1="290" x2="140" y2="400" stroke="#FFF7EA" stroke-width="4" stroke-dasharray="14 12" opacity="0.55" />
  <line x1="220" y1="290" x2="260" y2="400" stroke="#FFF7EA" stroke-width="4" stroke-dasharray="14 12" opacity="0.55" />

  <!-- runner -->
  <g transform="translate(200,330)">
    <ellipse cx="0" cy="52" rx="34" ry="9" fill="#150E24" opacity="0.35" />
    <rect x="-9" y="-14" width="18" height="44" rx="6" fill="url(#pants)" />
    <rect x="-14" y="26" width="28" height="12" rx="4" fill="url(#shoe)" />
    <rect x="-26" y="-46" width="52" height="48" rx="8" fill="url(#hoodie)" />
    <text x="0" y="-18" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="11" fill="#FFF7EA">YAJ</text>
    <rect x="-19" y="-84" width="38" height="36" rx="7" fill="url(#head)" />
    <rect x="-21" y="-98" width="42" height="16" rx="7" fill="url(#hair)" />
    <rect x="-11" y="-72" width="7" height="8" rx="1.5" fill="#241638" />
    <rect x="4" y="-72" width="7" height="8" rx="1.5" fill="#241638" />
    <rect x="-6" y="-58" width="12" height="4" rx="2" fill="#7A3B2A" />
    <rect x="-28" y="-40" width="12" height="22" rx="5" fill="url(#hoodie)" />
    <rect x="16" y="-40" width="12" height="22" rx="5" fill="url(#hoodie)" />
  </g>

  <!-- star -->
  <circle cx="290" cy="330" r="16" fill="#FFD166" opacity="0.25" />
  <path d="M290 319 l3 6.8 7.4 0.8 -5.5 5.2 1.3 7.4 -6.2-3.6 -6.2 3.6 1.3-7.4 -5.5-5.2 7.4-0.8z" fill="#FFD166" />

  <text x="200" y="378" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="26" fill="#ffffff" letter-spacing="1">YAJ CITY RUN</text>
</svg>
