<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <defs>
    <linearGradient id="drv-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a6fb0"/>
      <stop offset="60%" stop-color="#173a5e"/>
      <stop offset="100%" stop-color="#0a1a2b"/>
    </linearGradient>
    <linearGradient id="drv-road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3f47"/>
      <stop offset="100%" stop-color="#191c21"/>
    </linearGradient>
    <linearGradient id="drv-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f7fe0"/>
      <stop offset="100%" stop-color="#1c3d8f"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="768" fill="url(#drv-sky)"/>

  <!-- distant skyline -->
  <g fill="#0d2338" opacity="0.8">
    <rect x="60" y="300" width="70" height="180"/>
    <rect x="150" y="260" width="55" height="220"/>
    <rect x="820" y="280" width="60" height="200"/>
    <rect x="900" y="240" width="70" height="240"/>
  </g>

  <!-- road -->
  <path d="M 0,480 L 1024,480 L 1024,768 L 0,768 Z" fill="url(#drv-road)"/>
  <rect x="0" y="470" width="1024" height="10" fill="#f0d84c" opacity="0.8"/>
  <g stroke="#e9e4d8" stroke-width="14" stroke-dasharray="60 46" opacity="0.85">
    <line x1="0" y1="600" x2="1024" y2="600"/>
  </g>
  <g stroke="#e9e4d8" stroke-width="8" stroke-dasharray="40 34" opacity="0.6">
    <line x1="0" y1="540" x2="1024" y2="540"/>
    <line x1="0" y1="660" x2="1024" y2="660"/>
  </g>

  <!-- rival car receding into the distance -->
  <g transform="translate(700,510) scale(0.6)">
    <ellipse cx="0" cy="34" rx="70" ry="16" fill="rgba(0,0,0,0.35)"/>
    <path d="M -60,-24 Q -66,-40 -46,-40 L 36,-40 Q 66,-42 66,-14 L 66,14 Q 66,42 36,40 L -46,40 Q -66,40 -60,24 Z" fill="#c23b34" stroke="#150a08" stroke-width="5"/>
    <path d="M -8,-26 L 30,-27 Q 44,-26 44,-10 L 44,10 Q 44,26 30,27 L -8,25 Z" fill="#8fd3ff" opacity="0.85"/>
  </g>

  <!-- hero car, foreground -->
  <g transform="translate(400,640) scale(1.55)">
    <ellipse cx="0" cy="46" rx="120" ry="26" fill="rgba(0,0,0,0.4)"/>
    <path d="M -100,-46 Q -112,-64 -78,-64 L 60,-64 Q 112,-66 112,-24 L 112,24 Q 112,66 60,64 L -78,64 Q -112,64 -100,46 Z" fill="url(#drv-body)" stroke="#0a0e1a" stroke-width="7"/>
    <path d="M -14,-42 L 50,-44 Q 72,-42 72,-18 L 72,18 Q 72,42 50,44 L -14,40 Z" fill="#9fe0ff" opacity="0.9"/>
    <line x1="30" y1="-42" x2="30" y2="42" stroke="#0a0e1a" stroke-width="4" opacity="0.4"/>
    <rect x="-78" y="-76" width="42" height="24" rx="7" fill="#0a0e14"/>
    <rect x="-78" y="52" width="42" height="24" rx="7" fill="#0a0e14"/>
    <rect x="30" y="-76" width="42" height="24" rx="7" fill="#0a0e14"/>
    <rect x="30" y="52" width="42" height="24" rx="7" fill="#0a0e14"/>
    <circle cx="104" cy="-26" r="9" fill="#fff7c2"/>
    <circle cx="104" cy="26" r="9" fill="#fff7c2"/>
    <circle cx="-100" cy="-26" r="7" fill="#ff5555"/>
    <circle cx="-100" cy="26" r="7" fill="#ff5555"/>
  </g>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="5" opacity="0.35" stroke-linecap="round">
    <line x1="80" y1="560" x2="220" y2="560"/>
    <line x1="60" y1="600" x2="180" y2="600"/>
    <line x1="90" y1="700" x2="240" y2="700"/>
  </g>

  <rect x="0" y="620" width="1024" height="148" fill="#0a0e14" opacity="0"/>
</svg>
