<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <defs>
    <radialGradient id="bg-bg" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#3a2a5c"/>
      <stop offset="55%" stop-color="#241a3c"/>
      <stop offset="100%" stop-color="#0f0a1c"/>
    </radialGradient>
    <linearGradient id="bg-cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e6a8"/>
      <stop offset="100%" stop-color="#d9b23a"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="768" fill="url(#bg-bg)"/>

  <!-- floating balls -->
  <g opacity="0.5">
    <circle cx="120" cy="120" r="34" fill="#e0453f"/>
    <circle cx="900" cy="150" r="28" fill="#3a6bd6"/>
    <circle cx="80" cy="620" r="26" fill="#1c7a4e"/>
    <circle cx="950" cy="600" r="32" fill="#f0d84c"/>
  </g>

  <!-- caller ball, large -->
  <g transform="translate(512,190)">
    <circle r="80" fill="url(#bg-cell)" stroke="#7a5a10" stroke-width="6"/>
    <text x="0" y="-6" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#5a3a0a" text-anchor="middle">B</text>
    <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#241a05" text-anchor="middle">7</text>
  </g>

  <!-- bingo card grid -->
