<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <radialGradient id="sr-bg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="hsl(280,58%,30%)" />
      <stop offset="55%" stop-color="hsl(268,55%,17%)" />
      <stop offset="100%" stop-color="hsl(262,55%,8%)" />
    </radialGradient>
    <linearGradient id="sr-title-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6c8" />
      <stop offset="45%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#ff6fb0" />
    </linearGradient>
    <radialGradient id="sr-gem" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#c7f9ff"/><stop offset="60%" stop-color="#5fd0ff"/><stop offset="100%" stop-color="#1a7fc9"/></radialGradient>
    <radialGradient id="sr-gummy" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#ffc3dc"/><stop offset="60%" stop-color="#ff6fa3"/><stop offset="100%" stop-color="#c81f63"/></radialGradient>
    <radialGradient id="sr-drop" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#fff4b8"/><stop offset="60%" stop-color="#ffd166"/><stop offset="100%" stop-color="#c98a00"/></radialGradient>
  </defs>

  <rect width="300" height="400" fill="url(#sr-bg)" />

  <!-- Candy-maze corridor motif, background layer -->
  <g stroke="#ffb6dd" stroke-width="7" stroke-linecap="round" opacity="0.28" fill="none">
    <path d="M0 96 H96 V44" />
    <path d="M300 128 H206 V180 H130" />
    <path d="M0 260 H70 V320" />
    <path d="M300 300 H236 V352" />
  </g>

  <!-- Floating candy decor -->
  <g>
    <circle cx="34" cy="150" r="12" fill="url(#sr-gummy)" />
    <circle cx="266" cy="200" r="10" fill="url(#sr-gem)" />
    <circle cx="252" cy="70" r="9" fill="url(#sr-drop)" />
    <circle cx="26" cy="330" r="11" fill="url(#sr-gem)" />
    <circle cx="42" cy="250" r="8" fill="url(#sr-drop)" />
  </g>
  <g fill="#ffffff" opacity="0.85">
    <circle cx="60" cy="120" r="2.4" />
    <circle cx="248" cy="140" r="2" />
    <circle cx="80" cy="300" r="2.4" />
    <circle cx="220" cy="330" r="2" />
  </g>

  <!-- Motion streaks behind the chase -->
  <g stroke="#ff9ecb" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <line x1="255" y1="230" x2="205" y2="238" />
    <line x1="262" y1="252" x2="212" y2="258" />
    <line x1="248" y1="274" x2="200" y2="278" />
  </g>

  <!-- Dr. Cavity: white lab coat, chasing from upper right -->
  <g transform="translate(196,196) rotate(8)">
    <rect x="-24" y="46" width="16" height="30" rx="4" fill="#3a3f52" />
    <rect x="10" y="46" width="16" height="30" rx="4" fill="#3a3f52" />
    <rect x="-30" y="4" width="60" height="52" rx="10" fill="#f4f6f8" stroke="#d7dee3" stroke-width="2" />
    <rect x="-46" y="8" width="17" height="42" rx="7" fill="#eef1f3" stroke="#d7dee3" stroke-width="2" />
    <rect x="30" y="8" width="17" height="42" rx="7" fill="#eef1f3" stroke="#d7dee3" stroke-width="2" />
    <rect x="-24" y="-38" width="48" height="46" rx="9" fill="#f1e3d3" stroke="#d9c4a8" stroke-width="2" />
    <rect x="-16" y="-10" width="9" height="9" fill="#241a12" />
    <rect x="8" y="-10" width="9" height="9" fill="#241a12" />
    <rect x="-14" y="4" width="26" height="6" rx="2" fill="#4a3423" />
    <rect x="-15" y="-24" width="13" height="4" rx="2" fill="#3a2a1a" transform="rotate(-10 -8 -22)" />
    <rect x="2" y="-24" width="13" height="4" rx="2" fill="#3a2a1a" transform="rotate(10 8 -22)" />
    <rect x="-27" y="-46" width="52" height="6" rx="3" fill="#dfe6ea" />
    <circle cx="0" cy="-50" r="8" fill="#eaf7ff" stroke="#bcd8e6" stroke-width="2" />
  </g>

  <!-- Player: original YAJ block-style character, running from the chase -->
  <g transform="translate(96,246)">
    <rect x="-22" y="52" width="15" height="30" rx="4" fill="#2c3350" transform="rotate(-18 -14 60)" />
    <rect x="8" y="52" width="15" height="30" rx="4" fill="#2c3350" transform="rotate(20 16 60)" />
    <rect x="-28" y="8" width="56" height="50" rx="10" fill="#5b8cff" stroke="#3f68d6" stroke-width="2" />
    <rect x="-44" y="10" width="16" height="40" rx="7" fill="#5b8cff" stroke="#3f68d6" stroke-width="2" transform="rotate(-24 -36 30)" />
    <rect x="28" y="10" width="16" height="40" rx="7" fill="#ffcc4d" stroke="#e0a72e" stroke-width="2" transform="rotate(40 36 30)" />
    <rect x="-23" y="-36" width="46" height="44" rx="9" fill="#ffcc4d" stroke="#e0a72e" stroke-width="2" />
    <rect x="-15" y="-10" width="9" height="9" fill="#241a12" />
    <rect x="7" y="-10" width="9" height="9" fill="#241a12" />
    <rect x="-11" y="4" width="22" height="5" rx="2" fill="#241a12" />
  </g>

  <!-- Ground strip -->
  <rect x="0" y="352" width="300" height="48" fill="rgba(0,0,0,0.32)" />
  <rect x="0" y="352" width="300" height="4" fill="#ffb6dd" opacity="0.5" />

  <!-- Title lockup -->
  <text x="150" y="52" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="46" font-style="italic" fill="#3a1247" letter-spacing="0.5" transform="translate(0,4)">SUGAR</text>
  <text x="150" y="48" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="46" font-style="italic" fill="url(#sr-title-fill)" stroke="#3a1247" stroke-width="2" letter-spacing="0.5">SUGAR</text>
  <text x="150" y="98" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="46" font-style="italic" fill="#3a1247" letter-spacing="0.5" transform="translate(0,4)">RUSH</text>
  <text x="150" y="94" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="46" font-style="italic" fill="url(#sr-title-fill)" stroke="#3a1247" stroke-width="2" letter-spacing="0.5">RUSH</text>
</svg>
