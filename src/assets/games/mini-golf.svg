<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="hsl(124,48%,30%)" />
      <stop offset="60%" stop-color="hsl(140,45%,16%)" />
      <stop offset="100%" stop-color="hsl(144,48%,8%)" />
    </radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="hsl(122,45%,40%)" />
      <stop offset="100%" stop-color="hsl(124,48%,28%)" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" />

  <!-- Fairway -->
  <rect x="70" y="60" width="260" height="300" rx="18" fill="url(#green)" stroke="#0a1a0d" stroke-width="7" />

  <!-- Sand trap -->
  <ellipse cx="140" cy="150" rx="46" ry="30" fill="hsl(42,55%,62%)" stroke="hsl(42,45%,45%)" stroke-width="2" opacity="0.95" />

  <!-- Water hazard -->
  <ellipse cx="270" cy="230" rx="42" ry="28" fill="hsl(205,75%,42%)" stroke="hsl(205,75%,30%)" stroke-width="2" opacity="0.92" />

  <!-- Dashed putt path -->
  <path d="M 200 320 Q 230 220 200 110" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 8" opacity="0.6" />

  <!-- Cup + flag -->
  <ellipse cx="200" cy="105" rx="15" ry="8" fill="#0a0e0a" stroke="#000" stroke-width="1.5" />
  <line x1="200" y1="101" x2="200" y2="58" stroke="#e5e5e5" stroke-width="3" />
  <path d="M 200 58 L 224 68 L 200 78 Z" fill="#f0d84c" />

  <!-- Ball -->
  <circle cx="200" cy="320" r="11" fill="#f8f6f0" stroke="#b8b2a2" stroke-width="1.4" />
  <ellipse cx="200" cy="329" rx="9" ry="3" fill="rgba(0,0,0,0.25)" />

  <!-- Title lockup -->
  <text x="200" y="392" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="30" fill="#ffffff" letter-spacing="1">MINI GOLF</text>
</svg>
