<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="hsl(28,55%,28%)" />
      <stop offset="60%" stop-color="hsl(26,55%,15%)" />
      <stop offset="100%" stop-color="hsl(24,58%,7%)" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" />

  <!-- Running lane -->
  <rect x="110" y="20" width="180" height="360" fill="rgba(255,255,255,0.05)" />
  <line x1="110" y1="20" x2="110" y2="380" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <line x1="290" y1="20" x2="290" y2="380" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Gap hazard -->
  <rect x="110" y="220" width="180" height="34" fill="#0a0e14" />

  <!-- Spinning bar hazard -->
  <g transform="translate(200 150)">
    <rect x="-70" y="-6" width="140" height="12" rx="5" fill="#c0392b" stroke="#5c1a12" stroke-width="2" transform="rotate(24)" />
  </g>

  <!-- Coin -->
  <circle cx="200" cy="280" r="13" fill="#ffd54a" stroke="#a87a12" stroke-width="2" />

  <!-- Runner -->
  <g transform="translate(200 330)">
    <ellipse cx="0" cy="20" rx="24" ry="7" fill="rgba(0,0,0,0.3)" />
    <circle r="26" fill="#4da6ff" stroke="#0d3a6b" stroke-width="3" />
    <circle cx="-8" cy="-4" r="4" fill="#0d1b2a" />
    <circle cx="8" cy="-4" r="4" fill="#0d1b2a" />
  </g>

  <!-- Title lockup -->
  <text x="200" y="392" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="27" fill="#ffffff" letter-spacing="1">TUMBLE GUYS</text>
</svg>
