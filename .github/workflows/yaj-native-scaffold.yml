name: YAJ native scaffold validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaj-native-scaffold.yml'

permissions:
  contents: read

jobs:
  native-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Capacitor toolchain for validation
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/ios@7
      - name: Build web assets
        run: npm run build
      - name: Generate native projects
        run: |
          npx cap add android
          npx cap add ios
          npx cap sync
          test -f android/app/build.gradle
          test -f ios/App/App.xcodeproj/project.pbxproj
      - name: Build Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Archive Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yaj-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Smoke test Android emulator launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.yaj.app/.MainActivity
            sleep 8
            adb shell pidof com.yaj.app
            adb exec-out screencap -p > "$RUNNER_TEMP/yaj-android-launch.png"
      - name: Archive Android launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: yaj-android-launch-screenshot
          path: ${{ runner.temp }}/yaj-android-launch.png
          retention-days: 7
          if-no-files-found: error
      - name: Archive scaffold for review
        uses: actions/upload-artifact@v4
        with:
          name: yaj-native-scaffold
          path: |
            android/
            ios/
          retention-days: 7
          if-no-files-found: error
  ios-simulator-build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Capacitor toolchain for validation
        run: npm install --no-save --no-package-lock --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/ios@7
      - name: Build web assets
        run: npm run build
      - name: Generate iOS project
        run: |
          npx cap add ios
          npx cap sync ios
          test -d ios/App/App.xcworkspace
      - name: Compile iOS simulator app (no signing)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/yaj-ios-build" CODE_SIGNING_ALLOWED=NO build
          test -d "$RUNNER_TEMP/yaj-ios-build/Build/Products/Debug-iphonesimulator/App.app"
      - name: Smoke test iOS simulator launch
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d.get("isAvailable") and "iPhone" in d["name"]]; print(devices[0]["udid"] if devices else "")')
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator device found"
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH="$RUNNER_TEMP/yaj-ios-build/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/yaj-launch.png"
      - name: Archive iOS launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: yaj-ios-launch-screenshot
          path: ${{ runner.temp }}/yaj-launch.png
          retention-days: 7
          if-no-files-found: error
      - name: Archive iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: yaj-ios-simulator-app
          path: ${{ runner.temp }}/yaj-ios-build/Build/Products/Debug-iphonesimulator/App.app/
          retention-days: 7
          if-no-files-found: error
