name: YAJ native scaffold validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaj-native-scaffold.yml'

permissions:
  contents: read

jobs:
  native-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Capacitor toolchain for validation
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/ios@7
      - name: Build web assets
        run: npm run build
      - name: Generate native projects
        run: |
          npx cap add android
          npx cap add ios
          npx cap sync
          test -f android/app/build.gradle
          test -f ios/App/App.xcodeproj/project.pbxproj
      - name: Build Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Archive Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yaj-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Archive scaffold for review
        uses: actions/upload-artifact@v4
        with:
          name: yaj-native-scaffold
          path: |
            android/
            ios/
          retention-days: 7
          if-no-files-found: error
  ios-simulator-build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Capacitor toolchain for validation
        run: npm install --no-save --no-package-lock --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/ios@7
      - name: Build web assets
        run: npm run build
      - name: Generate iOS project
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Compile iOS simulator app (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/yaj-ios-build" CODE_SIGNING_ALLOWED=NO build
          test -d "$RUNNER_TEMP/yaj-ios-build/Build/Products/Debug-iphonesimulator/App.app"
      - name: Archive iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: yaj-ios-simulator-app
          path: ${{ runner.temp }}/yaj-ios-build/Build/Products/Debug-iphonesimulator/App.app/
          retention-days: 7
          if-no-files-found: error
