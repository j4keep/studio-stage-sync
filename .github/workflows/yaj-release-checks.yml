name: YAJ release checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Existing package-lock.json has stale root package metadata. Use
      # install without modifying the lockfile until it is regenerated.
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run tests
        run: npm test -- --passWithNoTests
      - name: Production build
        run: npm run build
      - name: Check generated web assets
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "Production assets ready for native packaging"
